<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#faf8f5"/>

  <!-- Decorative coral accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#f06b56"/>

  <!-- Teal accent circle -->
  <circle cx="1050" cy="520" r="180" fill="#03bfac" opacity="0.08"/>
  <circle cx="150" cy="110" r="120" fill="#f06b56" opacity="0.06"/>

  <!-- Logo text -->
  <text x="600" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="700" fill="#1a1a1a" letter-spacing="8">EYAS</text>

  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f06b56" font-weight="600" letter-spacing="6" text-transform="uppercase">PSICOLOGÍA</text>

  <!-- Divider line -->
  <line x1="500" y1="360" x2="700" y2="360" stroke="#ece5dc" stroke-width="2"/>

  <!-- Tagline -->
  <text x="600" y="410" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#555" font-style="italic">Psicoterapia online para mujeres</text>

  <!-- Description -->
  <text x="600" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#888">Mejora tus relaciones empezando por la tuya</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="#03bfac"/>
</svg>
